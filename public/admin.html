<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Zuno · Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--accent:#006591;--accent-bright:#0ea5e9;--line:#dbe3f2;--ink:#0b1c30;--muted:#5b6572}
  body{background:#f8f9ff;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  h1,h2,h3{font-family:'Hanken Grotesk',Inter,sans-serif}
  .btn-primary:hover{background:var(--accent-bright)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px}
  .field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;color:var(--ink);outline:none;font-size:.85rem;width:100%;transition:box-shadow .15s,border-color .15s}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.18)}
  .btn{border-radius:10px;padding:.5rem .9rem;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.04)} .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{background:#e5eeff}
  .btn-danger{background:#fff;color:#DC2626;border-color:#FCA5A5}
  .pill{font-size:.68rem;padding:2px 9px;border-radius:999px;font-weight:700}
  th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:.6rem .7rem;background:#F9FAFB;border-bottom:1px solid var(--line)}
  td{padding:.65rem .7rem;font-size:.83rem;border-bottom:1px solid var(--line);vertical-align:middle}
  a{color:var(--accent)}
</style>
</head>
<body class="min-h-screen">

<!-- LOGIN -->
<div id="login" class="fixed inset-0 flex items-center justify-center bg-black/60 z-40">
  <div class="card p-7 w-[360px]">
    <div class="text-center mb-5">
      <div class="mx-auto mb-3 w-12 h-12 rounded-xl bg-[#006591] text-white flex items-center justify-center text-xl"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="text-lg font-bold">Zuno Console</div>
      <div class="text-xs text-[#6B7280]">Platform owner sign in</div>
    </div>
    <input id="lu" class="field mb-2" placeholder="Username"/>
    <input id="lp" type="password" class="field mb-3" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn btn-primary w-full" onclick="doLogin()">Sign in</button>
    <div id="lerr" class="text-red-400 text-xs mt-2 text-center hidden"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-6xl mx-auto p-6">
  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-[#006591] text-white flex items-center justify-center"><i class="fa-solid fa-hubspot"></i></div>
      <div><div class="font-bold text-lg">Deployed Workspaces</div><div class="text-xs text-[#6B7280]" id="whoami"></div></div>
    </div>
    <button class="btn btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket mr-1"></i>Sign out</button>
  </header>

  <div class="grid md:grid-cols-3 gap-6">
    <!-- create -->
    <div class="card p-5 md:col-span-1 h-fit">
      <div class="font-semibold mb-3 text-sm">Add a third-party workspace</div>
      <label class="text-xs opacity-60">Business name</label>
      <input id="tName" class="field mt-1 mb-3" placeholder="Acme Co"/>
      <label class="text-xs opacity-60">Subdomain (slug)</label>
      <input id="tSlug" class="field mt-1 mb-3" placeholder="acme" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')"/>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-xs opacity-60">Admin user</label><input id="tUser" class="field mt-1" value="admin"/></div>
        <div><label class="text-xs opacity-60">Admin pass</label><input id="tPass" class="field mt-1" value="admin123"/></div>
      </div>
      <button class="btn btn-primary w-full mt-4" onclick="createTenant()">Create workspace</button>
      <div id="cErr" class="text-[#DC2626] text-xs mt-2 hidden"></div>
      <div id="cOk" class="text-xs mt-3 hidden p-3 rounded-lg bg-[#ECFDF5] border border-[#A7F3D0] text-[#065F46]"></div>
    </div>

    <!-- list -->
    <div class="card p-4 md:col-span-2 overflow-x-auto">
      <table class="w-full min-w-[640px]">
        <thead><tr>
          <th>Workspace</th><th>Plan</th><th>WhatsApp</th><th>Channels</th><th>Users</th><th>Actions</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="text-center text-sm opacity-50 py-10 hidden">No workspaces yet.</div>
    </div>
  </div>
</div>

<script>
const ORIGIN = window.location.origin;
const ROOT_HOSTPORT = window.location.host; // e.g. localhost:3001
let token = localStorage.getItem('sa_token') || '';

function api(p, opt={}) {
  return fetch(ORIGIN + '/api' + p, Object.assign({
    headers: Object.assign({ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }, opt.headers||{})
  }, opt)).then(r => r.json());
}
function show(el, on){ document.getElementById(el).classList.toggle('hidden', !on); }

async function doLogin(){
  const r = await api('/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username: lu.value.trim(), password: lp.value }) });
  if(r.success){ token=r.token; localStorage.setItem('sa_token',token); enter(r.user); }
  else { lerr.textContent = r.error||'Login failed'; show('lerr',true); }
}
function logout(){ api('/logout',{method:'POST'}); localStorage.removeItem('sa_token'); location.reload(); }

function enter(user){
  show('login',false); show('app',true);
  whoami.textContent = (user? user.username : '') + ' · ' + ROOT_HOSTPORT;
  refresh(); setInterval(refresh, 5000);
}

function waPill(s){
  const map = { ready:['#10B981', 'Connected'], qr:['#F59E0B','Scan QR'], authenticated:['#10B981','Linking'],
    starting:['#9CA3AF','Starting'], disconnected:['#9CA3AF','Unlinked'], stopped:['#9CA3AF','Off'],
    error:['#EF4444','Error'], undefined:['#9CA3AF','Off'] };
  const [c,label] = map[s] || ['#9CA3AF', s||'Off'];
  return `<span class="pill" style="background:${c}1A;color:${c}">${label}</span>`;
}
function chBadges(cs){
  return ['instagram','messenger','gmail'].map(k=>{
    const on = cs[k] && cs[k].status==='connected';
    return `<span class="pill" style="background:${on?'#dce9ff':'#e5eeff'};color:${on?'#006591':'#9CA3AF'};margin-right:3px">${k[0].toUpperCase()+k.slice(1,3)}</span>`;
  }).join('');
}

async function refresh(){
  const r = await api('/tenants');
  if(!r.success) return;
  show('empty', r.tenants.length===0);
  rows.innerHTML = r.tenants.map(t=>{
    const cs = t.channelStatus||{};
    const wa = cs.whatsapp ? cs.whatsapp.status : 'stopped';
    const url = window.location.protocol+'//'+t.slug+'.'+ROOT_HOSTPORT+'/';
    const plans = ['free','starter','growth','advanced'];
    return `<tr>
      <td>
        <div class="font-medium">${t.name}</div>
        <a href="${url}" target="_blank" class="text-xs text-[#006591]">${t.slug}.${ROOT_HOSTPORT} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>
      </td>
      <td><select class="field" style="padding:3px 6px" onchange="setPlan('${t._id}',this.value)">${plans.map(p=>`<option ${((t.plan||'free')===p)?'selected':''}>${p}</option>`).join('')}</select></td>
      <td>${waPill(wa)}</td>
      <td>${chBadges(cs)}</td>
      <td>${t.userCount}</td>
      <td>
        <div class="flex flex-wrap gap-1">
          <button class="btn btn-ghost" onclick="waAct('${t._id}','start')">Start</button>
          <button class="btn btn-ghost" onclick="waAct('${t._id}','stop')">Stop</button>
          <button class="btn btn-ghost" onclick="waAct('${t._id}','logout')">Unlink</button>
          <button class="btn btn-danger" onclick="delTenant('${t._id}','${t.name.replace(/'/g,'')}')">Delete</button>
        </div>
      </td></tr>`;
  }).join('');
}

async function createTenant(){
  show('cErr',false); show('cOk',false);
  const body = { name:tName.value.trim(), slug:tSlug.value.trim(), adminUser:tUser.value.trim(), adminPass:tPass.value.trim() };
  if(!body.name||!body.slug){ cErr.textContent='Name and slug required'; show('cErr',true); return; }
  const r = await api('/tenants', { method:'POST', body: JSON.stringify(body) });
  if(r.success){
    const url = window.location.protocol+'//'+r.tenant.slug+'.'+ROOT_HOSTPORT+'/';
    cOk.innerHTML = `Created <b>${r.tenant.name}</b><br>Portal: <a class="text-[#006591]" target="_blank" href="${url}">${url}</a><br>Login: <b>${r.login.username}</b> / <b>${r.login.password}</b>`;
    show('cOk',true); tName.value=''; tSlug.value=''; refresh();
  } else { cErr.textContent = r.error||'Failed'; show('cErr',true); }
}
async function waAct(id, action){ await api('/tenants/'+id+'/whatsapp/'+action, { method:'POST' }); refresh(); }
async function setPlan(id, plan){ await api('/tenants/'+id, { method:'PUT', body: JSON.stringify({ plan }) }); refresh(); }
async function delTenant(id, name){ if(!confirm('Delete workspace "'+name+'"? This unlinks its WhatsApp and removes its users.')) return; await api('/tenants/'+id, { method:'DELETE' }); refresh(); }

// auto-enter if token present
if(token){ api('/tenants').then(r=>{ if(r.success) enter(null); else { localStorage.removeItem('sa_token'); } }); }
</script>
</body>
</html>
